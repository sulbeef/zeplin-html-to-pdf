name: CI / CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  LC_ALL: C.UTF-8
  AWS_DEFAULT_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: "Create zip file"
        run: npm run pack

      - name: "Deploy to AWS Lambda"
        run: |
          aws lambda update-function-code --region us-east-1 --query '{State: State, StateReasonCode: StateReasonCode}' --function-name zeplin-html-to-pdf --zip-file fileb://`pwd`/package.zip

      - name: "Publish Lambda version"
        id: publish-version
        run: |
          set -e
          VERSION_OUTPUT=$(aws lambda publish-version \
            --region us-east-1 \
            --function-name zeplin-html-to-pdf \
            --query '{Version: Version, FunctionArn: FunctionArn, State: State, StateReasonCode: StateReasonCode}' \
            --output json) || { echo "Error: Failed to publish Lambda version"; exit 1; }
          
          echo "Published version output: $VERSION_OUTPUT"
          VERSION_NUMBER=$(echo "$VERSION_OUTPUT" | jq -r '.Version')
          VERSION_ARN=$(echo "$VERSION_OUTPUT" | jq -r '.FunctionArn')
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
          echo "VERSION_ARN=$VERSION_ARN" >> $GITHUB_ENV

      - name: "Update Lambda alias"
        run: |
          set -e
          
          # Determine target alias based on branch
          if [ "${{ github.ref_name }}" = "develop" ]; then
            ALIAS_NAME="stable"
          else
            echo "Error: No alias mapping for branch ${{ github.ref_name }}"
            exit 1
          fi
          
          echo "Updating alias $ALIAS_NAME to point to version $VERSION_NUMBER (ARN: $VERSION_ARN)"
          
          ALIAS_OUTPUT=$(aws lambda update-alias \
            --region us-east-1 \
            --function-name zeplin-html-to-pdf \
            --name "$ALIAS_NAME" \
            --function-version "$VERSION_NUMBER" \
            --query '{AliasArn: AliasArn, FunctionVersion: FunctionVersion, State: State, StateReasonCode: StateReasonCode}' \
            --output json) || { 
              echo "Error: Failed to update Lambda alias. Version ARN: $VERSION_ARN"
              exit 1
            }
          
          echo "Alias update output: $ALIAS_OUTPUT"
